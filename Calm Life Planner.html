<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<link rel="icon" href="data:," />
<title>Calm Life Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600;6..72,700&family=Public+Sans:wght@400;500;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/lucide@0.462.0/dist/umd/lucide.min.js"></script>
<style>
  :root{
    --bg:#FAF5EC; --bg2:#F3EBDB; --surface:#FFFDF8; --surface2:#F7F0E2;
    --ink:#33241A; --ink2:#5C4632; --muted:#6E5942; --line:#E5D7BF; --line2:#D9C8A8;
    --accent:#A5502A; --accent-ink:#FFFFFF; --accent-soft:#F6E3D6;
    --good:#5F7D3A; --warn:#B07A1E; --bad:#B23A2E;
    --shadow:0 1px 2px rgba(60,38,18,.06),0 8px 24px -12px rgba(60,38,18,.18);
    --radius:16px; --radius-s:10px;
    --font-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
    --font-display:"Newsreader",Georgia,serif;
    --base:16px;
    color-scheme:light;
  }
  html[data-mode="dark"]{
    --bg:#20150F; --bg2:#1A110C; --surface:#2B1E16; --surface2:#33251B;
    --ink:#F4EADA; --ink2:#DECDB4; --muted:#B49B7E; --line:#463322; --line2:#57402A;
    --accent-soft:#3D2A1D;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 26px -12px rgba(0,0,0,.55);
    color-scheme:dark;
  }
  html[data-theme="cocoa"]{ --accent:#A5502A; }
  html[data-theme="sage"]{ --accent:#67793F; }
  html[data-theme="apricot"]{ --accent:#C0731F; }
  html[data-theme="lavender"]{ --accent:#7563A6; }
  html[data-theme="ocean"]{ --accent:#38626F; }
  html[data-theme="rosewood"]{ --accent:#9C4353; }
  html[data-mode="dark"][data-theme="cocoa"]{ --accent:#D08054; }
  html[data-mode="dark"][data-theme="sage"]{ --accent:#9DB473; }
  html[data-mode="dark"][data-theme="apricot"]{ --accent:#E3A355; }
  html[data-mode="dark"][data-theme="lavender"]{ --accent:#AC9BD6; }
  html[data-mode="dark"][data-theme="ocean"]{ --accent:#7FA8B5; }
  html[data-mode="dark"][data-theme="rosewood"]{ --accent:#CE7E8C; }
  html[data-easyread="1"]{ --font-body:"Atkinson Hyperlegible","Public Sans",system-ui,sans-serif; letter-spacing:.012em; }
  html[data-textsize="small"]{ --base:14.5px; }
  html[data-textsize="large"]{ --base:18px; }

  *{ box-sizing:border-box; }
  html{ font-size:var(--base); }
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:var(--font-body); line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  button{ font:inherit; color:inherit; background:none; border:none; cursor:pointer; }
  input,select,textarea{ font:inherit; color:var(--ink); }
  :focus-visible{ outline:3px solid var(--accent); outline-offset:2px; border-radius:4px; }
  h1,h2,h3{ font-family:var(--font-display); font-weight:600; line-height:1.15; margin:0; }
  p{ margin:0; }
  .muted{ color:var(--muted); }
  .small{ font-size:.82rem; }
  .tiny{ font-size:.72rem; }

  #brightnessWrap{ min-height:100dvh; background:var(--bg); }

  /* ---------- Layout ---------- */
  .layout{ display:flex; max-width:1440px; margin:0 auto; }
  .sidebar{
    width:248px; flex:0 0 248px; position:sticky; top:0; height:100dvh;
    padding:22px 14px; border-right:1px solid var(--line);
    display:flex; flex-direction:column; gap:4px; overflow-y:auto; background:var(--bg);
  }
  .brand{ padding:2px 10px 16px; }
  .brand .name{ font-family:var(--font-display); font-size:1.42rem; font-weight:700; letter-spacing:.01em; }
  .brand .sub{ font-size:.78rem; color:var(--muted); margin-top:2px; }
  .navlabel{ font-size:.68rem; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); padding:14px 10px 6px; }
  .navitem{
    display:flex; align-items:center; gap:11px; width:100%; text-align:left;
    padding:9px 10px; border-radius:10px; font-size:.94rem; font-weight:500; color:var(--ink2);
  }
  .navitem svg{ width:19px; height:19px; flex:0 0 19px; }
  .navitem:hover{ background:var(--surface2); }
  .navitem.active{ background:var(--accent-soft); color:var(--ink); font-weight:600; }
  .navitem.active svg{ color:var(--accent); }
  .navitem .badge{ margin-left:auto; background:var(--bad); color:#fff; font-size:.66rem; font-weight:700; min-width:19px; height:19px; border-radius:99px; display:grid; place-items:center; padding:0 5px; }
  .sidefoot{ margin-top:auto; padding:12px 10px 2px; border-top:1px solid var(--line); }

  main{ flex:1; min-width:0; padding:26px 30px 110px; }
  .view{ display:none; animation:rise .28s ease both; }
  .view.active{ display:block; }
  @keyframes rise{ from{ opacity:0; transform:translateY(6px);} to{ opacity:1; transform:none;} }
  html[data-calm="1"] .view{ animation:none; }
  html[data-calm="1"] *{ transition:none !important; }

  .pagehead{ display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:20px; }
  .pagehead h1{ font-size:2rem; }
  .pagehead .lede{ color:var(--muted); margin-top:4px; max-width:56ch; }

  /* ---------- Cards & grids ---------- */
  .grid{ display:grid; gap:16px; }
  .grid.c2{ grid-template-columns:repeat(2,1fr); }
  .grid.c3{ grid-template-columns:repeat(3,1fr); }
  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:18px; box-shadow:var(--shadow);
  }
  .card h3{ font-size:1.13rem; margin-bottom:4px; display:flex; align-items:center; gap:8px; }
  .card h3 svg{ width:19px; height:19px; color:var(--accent); }
  .card .cardsub{ color:var(--muted); font-size:.85rem; margin-bottom:12px; }
  .span2{ grid-column:span 2; }

  .btn{
    display:inline-flex; align-items:center; gap:7px; padding:9px 15px; border-radius:99px;
    background:var(--accent); color:var(--accent-ink); font-weight:600; font-size:.9rem; min-height:42px;
  }
  .btn svg{ width:16px; height:16px; }
  .btn:hover{ filter:brightness(1.07); }
  .btn.ghost{ background:var(--surface2); color:var(--ink); border:1px solid var(--line2); }
  .btn.small{ padding:6px 12px; min-height:36px; font-size:.83rem; }
  .btn.danger{ background:var(--bad); }

  .field{ display:flex; flex-direction:column; gap:5px; margin-bottom:11px; }
  .field label{ font-size:.8rem; font-weight:600; color:var(--ink2); }
  .field input,.field select,.field textarea{
    background:var(--bg); border:1px solid var(--line2); border-radius:var(--radius-s);
    padding:9px 11px; width:100%;
  }
  .field textarea{ resize:vertical; min-height:64px; }
  .formrow{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .addbar{ display:flex; gap:8px; margin-top:10px; }
  .addbar input{ flex:1; background:var(--bg); border:1px solid var(--line2); border-radius:var(--radius-s); padding:9px 11px; min-width:0; }

  /* ---------- Lists ---------- */
  .list{ display:flex; flex-direction:column; }
  .row{
    display:flex; align-items:center; gap:11px; padding:10px 2px;
    border-bottom:1px solid var(--line);
  }
  .row:last-child{ border-bottom:none; }
  .row .grow{ flex:1; min-width:0; }
  .row .title{ font-weight:600; font-size:.95rem; overflow-wrap:anywhere; }
  .row .meta{ font-size:.8rem; color:var(--muted); }
  .row.done .title{ text-decoration:line-through; color:var(--muted); font-weight:500; }
  .tick{
    width:30px; height:30px; flex:0 0 30px; border-radius:50%;
    border:2px solid var(--line2); display:grid; place-items:center; color:transparent;
  }
  .tick svg{ width:15px; height:15px; }
  .tick.on{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .iconbtn{ width:34px; height:34px; flex:0 0 34px; border-radius:9px; display:grid; place-items:center; color:var(--muted); }
  .iconbtn:hover{ background:var(--surface2); color:var(--ink); }
  .iconbtn svg{ width:16px; height:16px; }
  .pill{ display:inline-flex; align-items:center; gap:5px; font-size:.72rem; font-weight:700; padding:3px 9px; border-radius:99px; background:var(--accent-soft); color:var(--ink2); white-space:nowrap; }
  .pill.warn{ background:#F7E8C8; color:#7A5410; }
  html[data-mode="dark"] .pill.warn{ background:#4A3A17; color:#EBCB8B; }
  .pill.bad{ background:#F8D9D3; color:#8E2B20; }
  html[data-mode="dark"] .pill.bad{ background:#4C241E; color:#F0AFA2; }
  .empty{ color:var(--muted); font-size:.9rem; padding:12px 2px; }

  .bar{ height:9px; border-radius:99px; background:var(--surface2); border:1px solid var(--line); overflow:hidden; }
  .bar > i{ display:block; height:100%; background:var(--accent); border-radius:99px; }
  .bignum{ font-family:var(--font-display); font-size:2.1rem; font-weight:700; line-height:1.05; }
  .statgrid{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
  .stat{ background:var(--surface2); border-radius:12px; padding:12px 14px; }
  .stat .v{ font-family:var(--font-display); font-size:1.35rem; font-weight:700; }
  .stat .k{ font-size:.75rem; color:var(--muted); font-weight:600; }

  /* ---------- Sample banner ---------- */
  .samplebar{
    display:flex; gap:12px; align-items:center; flex-wrap:wrap;
    background:var(--accent-soft); border:1px solid var(--line2); border-radius:var(--radius);
    padding:12px 16px; margin-bottom:18px;
  }
  .samplebar svg{ width:20px; height:20px; color:var(--accent); flex:0 0 20px; }
  .samplebar .grow{ flex:1; min-width:220px; font-size:.9rem; }

  /* ---------- Life Circle ---------- */
  .wheelwrap{ display:flex; flex-direction:column; align-items:center; gap:6px; padding:8px 0 2px; }
  .wheel{ position:relative; width:min(430px,86vw); aspect-ratio:1/1; }
  .wheel .spokes{ position:absolute; inset:0; width:100%; height:100%; }
  .wheel .center{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width:31%; aspect-ratio:1/1; border-radius:50%; background:var(--accent); color:#fff;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
    box-shadow:var(--shadow); text-align:center; padding:8px;
  }
  .wheel .center svg{ width:26px; height:26px; }
  .wheel .center .t{ font-family:var(--font-display); font-weight:700; font-size:1.02rem; line-height:1.1; }
  .wheel .center .s{ font-size:.64rem; opacity:.85; }
  .wheel .node{
    position:absolute; width:19.5%; aspect-ratio:1/1; transform:translate(-50%,-50%);
    border-radius:50%; background:var(--surface); border:1.5px solid var(--line2);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;
    box-shadow:var(--shadow); padding:4px;
  }
  .wheel .node:hover{ border-color:var(--accent); }
  .wheel .node svg{ width:21px; height:21px; color:var(--accent); }
  .wheel .node .n{ font-size:.62rem; font-weight:700; line-height:1.1; text-align:center; }
  .wheel .node .c{ font-size:.58rem; color:var(--muted); line-height:1; }

  /* Mood */
  .moods{ display:flex; gap:8px; flex-wrap:wrap; }
  .moodbtn{
    flex:1; min-width:52px; padding:9px 4px; border-radius:12px; border:1.5px solid var(--line2);
    background:var(--bg); text-align:center; font-size:.78rem; font-weight:600; color:var(--ink2);
  }
  .moodbtn svg{ width:20px; height:20px; display:block; margin:0 auto 3px; }
  .moodbtn.on{ border-color:var(--accent); background:var(--accent-soft); color:var(--ink); }
  .moodbtn.on svg{ color:var(--accent); }

  /* Calendar */
  .seg{ display:inline-flex; background:var(--surface2); border:1px solid var(--line); border-radius:99px; padding:3px; gap:2px; }
  .seg button{ padding:7px 14px; border-radius:99px; font-weight:600; font-size:.85rem; color:var(--muted); min-height:36px; }
  .seg button.on{ background:var(--surface); color:var(--ink); box-shadow:var(--shadow); }
  .cal{ display:grid; grid-template-columns:repeat(7,1fr); gap:5px; }
  .cal .dow{ font-size:.68rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); text-align:center; padding:4px 0; }
  .cal .day{
    aspect-ratio:1/1.08; border-radius:10px; border:1px solid var(--line); background:var(--bg);
    display:flex; flex-direction:column; align-items:center; padding:5px 2px; gap:3px; font-size:.85rem; font-weight:600;
  }
  .cal .day.out{ opacity:.35; }
  .cal .day.today{ border-color:var(--accent); border-width:2px; }
  .cal .day.sel{ background:var(--accent-soft); }
  .cal .dots{ display:flex; gap:3px; }
  .cal .dot{ width:6px; height:6px; border-radius:50%; background:var(--accent); }
  .cal .dot.done{ background:var(--good); }
  .weekday{ border:1px solid var(--line); border-radius:12px; padding:12px 14px; background:var(--bg); }
  .weekday.today{ border-color:var(--accent); }

  /* Timer */
  .timerface{ font-family:var(--font-display); font-size:4rem; font-weight:700; text-align:center; line-height:1; font-variant-numeric:tabular-nums; }
  .timermodes{ display:flex; justify-content:center; gap:8px; flex-wrap:wrap; }

  /* Alert */
  .alert{ display:flex; gap:11px; align-items:flex-start; background:#FBF0DA; border:1px solid #E8CF9E; color:#6B4E0E; border-radius:12px; padding:12px 14px; font-size:.9rem; }
  .alert svg{ width:19px; height:19px; flex:0 0 19px; margin-top:1px; }
  html[data-mode="dark"] .alert{ background:#3D3016; border-color:#6B551F; color:#EFD9A0; }

  /* Settings */
  .swatches{ display:flex; gap:10px; flex-wrap:wrap; }
  .swatch{ width:52px; text-align:center; }
  .swatch .dot{ width:40px; height:40px; border-radius:50%; margin:0 auto 4px; border:3px solid transparent; display:block; }
  .swatch.on .dot{ border-color:var(--ink); }
  .swatch .nm{ font-size:.68rem; font-weight:600; color:var(--muted); }
  .setrow{ display:flex; align-items:center; justify-content:space-between; gap:14px; padding:13px 2px; border-bottom:1px solid var(--line); }
  .setrow:last-child{ border-bottom:none; }
  .setrow .grow{ flex:1; }
  .setrow .t{ font-weight:600; font-size:.95rem; }
  .setrow .d{ font-size:.8rem; color:var(--muted); }
  .switch{ width:52px; height:30px; flex:0 0 52px; border-radius:99px; background:var(--line2); position:relative; transition:background .2s; }
  .switch::after{ content:""; position:absolute; top:3px; left:3px; width:24px; height:24px; border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.3); transition:left .2s; }
  .switch.on{ background:var(--accent); }
  .switch.on::after{ left:25px; }
  input[type="range"]{ accent-color:var(--accent); width:170px; }

  /* Bottom nav (mobile) */
  .bottomnav{
    display:none; position:fixed; left:0; right:0; bottom:0; z-index:40;
    background:var(--surface); border-top:1px solid var(--line);
    padding:6px 4px calc(6px + env(safe-area-inset-bottom));
  }
  .bottomnav .inner{ display:grid; grid-template-columns:repeat(5,1fr); max-width:560px; margin:0 auto; }
  .bottomnav button{ display:flex; flex-direction:column; align-items:center; gap:2px; padding:7px 2px; font-size:.66rem; font-weight:600; color:var(--muted); border-radius:10px; min-height:52px; justify-content:center; }
  .bottomnav button svg{ width:21px; height:21px; }
  .bottomnav button.active{ color:var(--accent); }

  .toast{
    position:fixed; left:50%; bottom:96px; transform:translateX(-50%) translateY(16px);
    background:var(--ink); color:var(--bg); padding:11px 18px; border-radius:99px; font-size:.88rem; font-weight:600;
    opacity:0; pointer-events:none; transition:opacity .25s, transform .25s; z-index:60; max-width:88vw; text-align:center;
  }
  .toast.show{ opacity:1; transform:translateX(-50%); }

  /* Low battery: strip decoration & motion */
  html[data-lowbattery="1"] *{ animation:none !important; transition:none !important; }
  html[data-lowbattery="1"] .card{ box-shadow:none; }

  /* Foggy day: hide the extras on Home */
  html[data-foggy="1"] .foggyhide{ display:none !important; }

  @media (max-width:1080px){
    .grid.c3{ grid-template-columns:repeat(2,1fr); }
    .span2{ grid-column:span 2; }
  }
  @media (max-width:860px){
    .sidebar{ display:none; }
    .bottomnav{ display:block; }
    main{ padding:20px 16px 118px; }
    .pagehead h1{ font-size:1.62rem; }
    .grid.c2,.grid.c3{ grid-template-columns:1fr; }
    .span2{ grid-column:span 1; }
    .statgrid{ grid-template-columns:repeat(3,1fr); gap:8px; }
    .stat .v{ font-size:1.1rem; }
    .formrow{ grid-template-columns:1fr; }
    .timerface{ font-size:3.2rem; }
    .bignum{ font-size:1.8rem; }
  }
  @media (prefers-reduced-motion:reduce){
    *{ animation:none !important; transition:none !important; }
  }
</style>
</head>
<body>
<div id="brightnessWrap">
  <div class="layout">
    <aside class="sidebar" aria-label="Planner sections">
      <div class="brand">
        <div class="name">Calm Life Planner</div>
        <div class="sub" id="brandDate"></div>
      </div>
      <button class="navitem" data-nav="home"><i data-lucide="home"></i>Home</button>
      <div class="navlabel">Life hubs</div>
      <div id="sideHubs"></div>
      <div class="navlabel">App</div>
      <button class="navitem" data-nav="settings"><i data-lucide="settings-2"></i>Settings</button>
      <div class="sidefoot">
        <p class="tiny muted">Your data is saved in this browser on this device only. Export a backup from Settings any time.</p>
      </div>
    </aside>

    <main id="main">
      <div id="sampleSlot"></div>
      <section class="view" id="view-home"></section>
      <section class="view" id="view-plan"></section>
      <section class="view" id="view-money"></section>
      <section class="view" id="view-goals"></section>
      <section class="view" id="view-learn"></section>
      <section class="view" id="view-explore"></section>
      <section class="view" id="view-people"></section>
      <section class="view" id="view-career"></section>
      <section class="view" id="view-household"></section>
      <section class="view" id="view-mind"></section>
      <section class="view" id="view-wellness"></section>
      <section class="view" id="view-settings"></section>
    </main>
  </div>

  <nav class="bottomnav" aria-label="Main">
    <div class="inner">
      <button data-nav="home"><i data-lucide="home"></i>Home</button>
      <button data-nav="plan"><i data-lucide="calendar-check"></i>Plan</button>
      <button data-nav="money"><i data-lucide="wallet"></i>Money</button>
      <button data-nav="goals"><i data-lucide="target"></i>Goals</button>
      <button data-nav="settings"><i data-lucide="settings-2"></i>Settings</button>
    </div>
  </nav>
  <div class="toast" id="toast" role="status"></div>
</div>

<script>
"use strict";
/* ================= Helpers ================= */
var $ = function(s, r){ return (r||document).querySelector(s); };
var $$ = function(s, r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); };
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function pad(n){ return (n<10?"0":"")+n; }
function dstr(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function todayStr(){ return dstr(new Date()); }
function addDaysStr(base, n){ var d = new Date(base+"T12:00:00"); d.setDate(d.getDate()+n); return dstr(d); }
function fmtDate(s){ if(!s) return ""; var d = new Date(s+"T12:00:00"); return d.toLocaleDateString(undefined,{weekday:"short", month:"short", day:"numeric"}); }
function fmtDateLong(s){ var d = new Date((s||todayStr())+"T12:00:00"); return d.toLocaleDateString(undefined,{weekday:"long", month:"long", day:"numeric", year:"numeric"}); }
function money(n){ var v = Number(n)||0; return (v<0?"-$":"$") + Math.abs(v).toLocaleString(undefined,{minimumFractionDigits:2, maximumFractionDigits:2}); }
function toast(msg){ var t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(function(){ t.classList.remove("show"); }, 2400); }
function icons(){ if(window.lucide){ lucide.createIcons(); } }

var HUBS = [
  {id:"plan", name:"Plan", icon:"calendar-check"},
  {id:"money", name:"Money", icon:"wallet"},
  {id:"goals", name:"Goals", icon:"target"},
  {id:"learn", name:"Learn", icon:"book-open"},
  {id:"explore", name:"Explore", icon:"compass"},
  {id:"people", name:"People", icon:"heart-handshake"},
  {id:"career", name:"Career", icon:"briefcase"},
  {id:"household", name:"Household", icon:"lamp"},
  {id:"mind", name:"Mind", icon:"sparkles"},
  {id:"wellness", name:"Wellness", icon:"leaf"}
];

  }catch(e){}

}

function applySettings(){
  var st = S.settings, root = document.documentElement;
  root.setAttribute("data-theme", st.theme);
  var dark = st.mode==="dark" || (st.mode==="system" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
  root.setAttribute("data-mode", dark ? "dark" : "light");
  root.setAttribute("data-textsize", st.textSize);
  root.setAttribute("data-easyread", st.easyRead ? "1" : "0");
  root.setAttribute("data-foggy", st.foggy ? "1" : "0");
  root.setAttribute("data-calm", st.calm ? "1" : "0");
  root.setAttribute("data-lowbattery", st.lowBattery ? "1" : "0");
  $("#brightnessWrap").style.filter = "brightness(" + (st.brightness/100) + ")";
}
function setSetting(k, v){ S.settings[k] = v; save(); applySettings(); render(); }

function go(view){
  ui.view = view;
  $$(".view").forEach(function(v){ v.classList.toggle("active", v.id === "view-"+view); });
  $$("[data-nav]").forEach(function(b){ b.classList.toggle("active", b.getAttribute("data-nav") === view); });

/* ================= Shared pieces ================= */
function pageHead(title, lede){
  return '<div class="pagehead"><div><h1>'+esc(title)+'</h1><p class="lede">'+esc(lede)+'</p></div></div>';
}
function rowHTML(item, opts){
  opts = opts || {};
  var h = '<div class="row'+(item.done?' done':'')+'">';
  if(opts.tick !== false && typeof item.done === "boolean"){
    h += '<button class="tick'+(item.done?' on':'')+'" aria-label="Mark done" onclick="'+opts.onToggle+'(\''+item.id+'\')"><i data-lucide="check"></i></button>';
  }
  h += '<div class="grow"><div class="title">'+esc(opts.title || item.text || item.title || item.name || "")+'</div>';
  if(opts.meta) h += '<div class="meta">'+esc(opts.meta)+'</div>';
  h += '</div>';
  if(opts.right) h += opts.right;
  if(opts.onDelete) h += '<button class="iconbtn" aria-label="Delete" onclick="'+opts.onDelete+'(\''+item.id+'\')"><i data-lucide="trash-2"></i></button>';
  return h + '</div>';
}
function emptyHTML(text){ return '<p class="empty">'+esc(text)+'</p>'; }
function findById(arr, id){ for(var i=0;i<arr.length;i++) if(arr[i].id===id) return arr[i]; return null; }
function toggleIn(arrName, id){ var it = findById(S[arrName], id); if(it){ it.done = !it.done; save(); render(); } }
function deleteFrom(arrName, id){ S[arrName] = S[arrName].filter(function(x){ return x.id !== id; }); save(); render(); }
function addFromInput(arrName, inputId, extra){
  var inp = document.getElementById(inputId);
  var v = inp.value.trim(); if(!v) return;
  var item = { id: uid(), text: v };
  if(extra) for(var k in extra) item[k] = extra[k];
  if(typeof item.done === "undefined" && arrName !== "brainDump" && arrName !== "ideas" && arrName !== "gifts") item.done = false;
  S[arrName].push(item); save(); render();
  toast("Added");
}

/* ================= Money maths ================= */
function billsTotal(){ return S.bills.reduce(function(a,b){ return a + (Number(b.amount)||0); }, 0); }
function billsUnpaid(){ return S.bills.filter(function(b){ return !b.paid; }).reduce(function(a,b){ return a + (Number(b.amount)||0); }, 0); }
function assetsTotal(){ return S.accounts.filter(function(a){ return a.kind==="asset"; }).reduce(function(a,b){ return a + (Number(b.amount)||0); }, 0); }
function debtTotal(){ return S.debts.reduce(function(a,b){ return a + (Number(b.balance)||0); }, 0); }
function netWorth(){ return assetsTotal() - debtTotal(); }
function safePerDay(){
  var now = new Date();
  var daysLeft = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate() - now.getDate() + 1;
  var left = (Number(S.income)||0) - billsTotal() - (Number(S.savingsGoal)||0);
  return { perDay: Math.max(0, left / Math.max(1, daysLeft)), daysLeft: daysLeft, left: left };
}
function medAlerts(){ return S.meds.filter(function(m){ return (Number(m.supply)||0) <= 7; }); }

/* ================= Radar (Year Map) ================= */
function hubScores(){
  var done = function(arr){ return arr.filter(function(x){ return x.done; }).length; };
  var cap = function(v){ return Math.max(8, Math.min(100, Math.round(v))); };
  return [
    {label:"Plan", v: cap(S.tasks.length ? (done(S.tasks)/S.tasks.length)*100 : 10)},
    {label:"Money", v: cap(30 + S.noSpend.length*9 + (netWorth() > 0 ? 22 : 0))},
    {label:"Goals", v: cap(S.goals.length ? S.goals.reduce(function(a,g){ return a+(Number(g.progress)||0); },0)/S.goals.length : 10)},
    {label:"Learn", v: cap(18 + S.books.length*14 + S.courses.length*16)},
    {label:"Explore", v: cap(15 + S.trips.length*16 + S.bookings.length*14)},
    {label:"People", v: cap(20 + S.people.length*13 + S.events.length*10)},
    {label:"Career", v: cap(22 + S.incomeStreams.length*15 + done(S.hustle)*10)},
    {label:"House", v: cap(20 + S.inventory.length*11 + done(S.morning)*6)},
    {label:"Mind", v: cap(16 + S.gratitude.length*14 + S.journal.length*16)},
    {label:"Wellness", v: cap(18 + S.fitness.length*13 + S.recipes.length*9)}
  ];
}
function radarSVG(){
  var scores = hubScores(), cx = 170, cy = 158, R = 108, n = scores.length, i, a, pts = "", grid = "", labels = "";
  for(var ring=1; ring<=4; ring++){
    var rp = [];
    for(i=0;i<n;i++){ a = -Math.PI/2 + i*2*Math.PI/n; rp.push((cx + Math.cos(a)*R*ring/4).toFixed(1)+","+(cy + Math.sin(a)*R*ring/4).toFixed(1)); }
    grid += '<polygon points="'+rp.join(" ")+'" fill="none" stroke="var(--line2)" stroke-width="1"/>';
  }
  for(i=0;i<n;i++){
    a = -Math.PI/2 + i*2*Math.PI/n;
    grid += '<line x1="'+cx+'" y1="'+cy+'" x2="'+(cx+Math.cos(a)*R).toFixed(1)+'" y2="'+(cy+Math.sin(a)*R).toFixed(1)+'" stroke="var(--line)" stroke-width="1"/>';
    pts += (cx + Math.cos(a)*R*scores[i].v/100).toFixed(1)+","+(cy + Math.sin(a)*R*scores[i].v/100).toFixed(1)+" ";
    var lx = cx + Math.cos(a)*(R+24), ly = cy + Math.sin(a)*(R+18);
    labels += '<text x="'+lx.toFixed(1)+'" y="'+ly.toFixed(1)+'" text-anchor="middle" font-size="11.5" font-weight="600" fill="var(--ink2)">'+scores[i].label+'</text>';
    labels += '<text x="'+lx.toFixed(1)+'" y="'+(ly+13).toFixed(1)+'" text-anchor="middle" font-size="10" fill="var(--muted)">'+scores[i].v+'</text>';
  }
  return '<svg viewBox="0 0 340 316" style="width:100%;max-width:400px;display:block;margin:0 auto" role="img" aria-label="Life balance radar chart">'
    + grid + '<polygon points="'+pts+'" fill="var(--accent)" fill-opacity="0.22" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>' + labels + '</svg>';
}

      + '<div class="field"><label>Your letter</label><textarea id="letterText" placeholder="Dear future me…">'+esc(S.letter.sealed ? "" : S.letter.text)+'</textarea></div>'
      + '<div class="field"><label>Open on</label><input id="letterDate" type="date" value="'+(S.letter.openDate || addDaysStr(todayStr(), 90))+'"></div>'
      + '<button class="btn" onclick="sealLetter()"><i data-lucide="lock"></i>Seal the letter</button></div>';
  }
  h += '</div><div>'
    + '<div class="card"><h3><i data-lucide="heart"></i>Gratitude jar</h3><p class="cardsub">'+S.gratitude.length+' good thing'+(S.gratitude.length===1?"":"s")+' saved. On a flat day, read three at random.</p><div class="list">'
    + (S.gratitude.length ? S.gratitude.slice(0,8).map(function(g){
        return rowHTML(g, { tick:false, onDelete:"delGratitude", title:g.text, meta:fmtDate(g.date) });
      }).join("") : emptyHTML("The jar is empty — one small good thing will start it."))
    + '</div><div class="addbar"><input id="addGrat" type="text" placeholder="One good thing from today…" maxlength="120" onkeydown="if(event.key===\'Enter\')addGratitudeFn()"><button class="btn small" onclick="addGratitudeFn()">Add</button></div></div>'
    + '<div class="card" style="margin-top:16px"><h3><i data-lucide="notebook-pen"></i>Journal</h3><p class="cardsub">No streaks, no word counts. Just today, in your own words.</p>'
    + '<div class="field"><textarea id="journalText" placeholder="Dear diary is optional. Start anywhere…"></textarea></div>'
    + '<button class="btn small" onclick="addJournalFn()"><i data-lucide="plus"></i>Save entry</button>'
    + '<div class="list" style="margin-top:8px">'
    + (S.journal.length ? S.journal.slice(0,5).map(function(j){
        return rowHTML(j, { tick:false, onDelete:"delJournal", title:j.text, meta:fmtDate(j.date) });
      }).join("") : emptyHTML("No entries yet."))

    + '</div></div>';
  $("#view-mind").innerHTML = h;
}

/* ================= Wellness ================= */
function toggleMorning(id){ toggleIn("morning", id); }
function toggleEvening(id){ toggleIn("evening", id); }
function delMorning(id){ deleteFrom("morning", id); }
function delEvening(id){ deleteFrom("evening", id); }
function toggleGrocery(id){ toggleIn("groceries", id); }
function delGrocery(id){ deleteFrom("groceries", id); }
function recipeToGrocery(id){
  var r = findById(S.recipes, id); if(!r) return;
  r.ingredients.forEach(function(ing){ S.groceries.push({ id:uid(), text:ing + " (" + r.name + ")", done:false }); });
  save(); render(); toast("Ingredients added to the grocery list");
}
function delRecipe(id){ deleteFrom("recipes", id); }
function addRecipeFn(){
  var name = $("#recName").value.trim(); if(!name){ toast("Add a recipe name"); return; }
  var ings = $("#recIngs").value.split(",").map(function(x){ return x.trim(); }).filter(Boolean);
  S.recipes.push({ id:uid(), name:name, time:$("#recTime").value.trim() || "—", ingredients:ings });
  save(); render(); toast("Recipe saved");
}
function delMed(id){ deleteFrom("meds", id); }
function refillMed(id){ var m = findById(S.meds, id); if(m){ m.supply = 30; save(); render(); toast(m.name + " marked as refilled (30 days)"); } }
function addMedFn(){
  var name = $("#medName").value.trim(); if(!name){ toast("Add a medication name"); return; }
  var sup = parseInt($("#medSupply").value, 10);
  S.meds.push({ id:uid(), name:name, dose:$("#medDose").value.trim(), supply:isNaN(sup)?0:sup });
  save(); render(); toast("Medication added");
}
function delFitness(id){ deleteFrom("fitness", id); }
function addFitnessFn(){
  var text = $("#fitText").value.trim(); if(!text){ toast("Describe the session"); return; }
  S.fitness.unshift({ id:uid(), date:$("#fitDate").value || todayStr(), text:text, detail:$("#fitDetail").value.trim() });
  save(); render(); toast("Session logged");
}
function routineCard(title, icon, arr, toggleFn, delFn, inputId, addArg){
  return '<div class="card"><h3><i data-lucide="'+icon+'"></i>'+title+'</h3><div class="list">'
    + (arr.length ? arr.map(function(x){ return rowHTML(x, { onToggle:toggleFn, onDelete:delFn }); }).join("") : emptyHTML("Nothing here yet."))
    + '</div><div class="addbar"><input id="'+inputId+'" type="text" placeholder="Add a step…" maxlength="80" onkeydown="if(event.key===\'Enter\')addFromInput(\''+addArg+'\',\''+inputId+'\',{done:false})"><button class="btn small" onclick="addFromInput(\''+addArg+'\',\''+inputId+'\',{done:false})">Add</button></div></div>';
}
function renderWellness(){
  var alerts = medAlerts();
  var h = pageHead("Wellness", "Routines that bookend the day, recipes that write their own shopping list, medication that reminds you before it runs out.");
  if(alerts.length){
    h += '<div class="alert" style="margin-bottom:16px"><i data-lucide="pill"></i><div><strong>Refill reminder:</strong> '
      + alerts.map(function(m){ return esc(m.name)+" has about "+m.supply+" days left"; }).join("; ")
      + '. Order or collect the refill this week.</div></div>';
  }
  h += '<div class="grid c2"><div class="grid" style="gap:16px;align-content:start">'
    + routineCard("Morning routine", "sunrise", S.morning, "toggleMorning", "delMorning", "addMorning", "morning")
    + routineCard("Evening routine", "moon-star", S.evening, "toggleEvening", "delEvening", "addEvening", "evening")
    + '<div class="card"><h3><i data-lucide="activity"></i>Fitness log</h3><div class="list">'
    + (S.fitness.length ? S.fitness.slice(0,6).map(function(f){
        return rowHTML(f, { tick:false, onDelete:"delFitness", title:f.text, meta:fmtDate(f.date)+(f.detail ? " · "+f.detail : "") });
      }).join("") : emptyHTML("No sessions logged yet — a ten-minute walk counts."))
    + '</div>'
    + '<div class="formrow" style="margin-top:12px"><div class="field" style="margin:0"><label>Session</label><input id="fitText" type="text" placeholder="Walk, run, yoga, swim…"></div>'
    + '<div class="field" style="margin:0"><label>Date</label><input id="fitDate" type="date" value="'+todayStr()+'"></div></div>'
    + '<div class="field" style="margin-top:10px"><label>Detail</label><input id="fitDetail" type="text" placeholder="Duration, distance, how it felt" maxlength="60"></div>'
    + '<button class="btn small" onclick="addFitnessFn()"><i data-lucide="plus"></i>Log session</button></div>'
    + '</div><div class="grid" style="gap:16px;align-content:start">'
    + '<div class="card"><h3><i data-lucide="chef-hat"></i>Recipes</h3><p class="cardsub">One tap sends a recipe\u2019s ingredients to the grocery list.</p><div class="grid" style="gap:12px">'
    + (S.recipes.length ? S.recipes.map(function(r){
        return '<div style="border:1px solid var(--line);border-radius:12px;padding:13px 14px;background:var(--bg)"><div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start"><strong>'+esc(r.name)+'</strong><span class="pill">'+esc(r.time)+'</span></div>'
          + '<p class="small muted" style="margin:5px 0 10px">'+esc(r.ingredients.join(" · "))+'</p>'
          + '<div style="display:flex;gap:8px"><button class="btn small" onclick="recipeToGrocery(\''+r.id+'\')"><i data-lucide="shopping-basket"></i>To grocery list</button>'
          + '<button class="btn ghost small" onclick="delRecipe(\''+r.id+'\')">Delete</button></div></div>';
      }).join("") : emptyHTML("No recipes yet."))
    + '</div>'
    + '<div class="formrow" style="margin-top:14px"><div class="field" style="margin:0"><label>Recipe name</label><input id="recName" type="text" placeholder="e.g. Veggie curry"></div>'
    + '<div class="field" style="margin:0"><label>Time</label><input id="recTime" type="text" placeholder="e.g. 30 min" maxlength="12"></div></div>'
    + '<div class="field" style="margin-top:10px"><label>Ingredients (comma separated)</label><input id="recIngs" type="text" placeholder="Rice, coconut milk, curry paste…"></div>'
    + '<button class="btn small" onclick="addRecipeFn()"><i data-lucide="plus"></i>Add recipe</button></div>'
    + '<div class="card"><h3><i data-lucide="shopping-basket"></i>Grocery list</h3><div class="list">'
    + (S.groceries.length ? S.groceries.map(function(x){ return rowHTML(x, { onToggle:"toggleGrocery", onDelete:"delGrocery" }); }).join("") : emptyHTML("List is empty — send a recipe over, or add items below."))
    + '</div><div class="addbar"><input id="addGrocery" type="text" placeholder="Add an item…" maxlength="80" onkeydown="if(event.key===\'Enter\')addFromInput(\'groceries\',\'addGrocery\',{done:false})"><button class="btn small" onclick="addFromInput(\'groceries\',\'addGrocery\',{done:false})">Add</button></div></div>'
    + '<div class="card"><h3><i data-lucide="pill"></i>Medication &amp; refills</h3><p class="cardsub">Anything at 7 days or less raises the refill reminder.</p><div class="list">'
    + (S.meds.length ? S.meds.map(function(m){
        var low = (Number(m.supply)||0) <= 7;
        return '<div class="row"><div class="grow"><div class="title">'+esc(m.name)+'</div><div class="meta">'+esc(m.dose)+'</div></div>'
          + '<span class="pill'+(low?' bad':'')+'">'+m.supply+' days left</span>'
          + '<button class="iconbtn" title="Mark refilled" aria-label="Mark refilled" onclick="refillMed(\''+m.id+'\')"><i data-lucide="refresh-ccw"></i></button>'
          + '<button class="iconbtn" aria-label="Delete" onclick="delMed(\''+m.id+'\')"><i data-lucide="trash-2"></i></button></div>';
      }).join("") : emptyHTML("No medication tracked."))
    + '</div>'
    + '<div class="formrow" style="margin-top:12px"><div class="field" style="margin:0"><label>Name</label><input id="medName" type="text" placeholder="Medication"></div>'
    + '<div class="field" style="margin:0"><label>Days of supply left</label><input id="medSupply" type="number" min="0" value="30"></div></div>'
    + '<div class="field" style="margin-top:10px"><label>Dose</label><input id="medDose" type="text" placeholder="e.g. 1 tablet at night" maxlength="60"></div>'
    + '<button class="btn small" onclick="addMedFn()"><i data-lucide="plus"></i>Add medication</button></div>'
    + '</div></div>';
  $("#view-wellness").innerHTML = h;
}

/* ================= Settings ================= */
var THEMES = [ ["cocoa","#A5502A","Cocoa"], ["sage","#67793F","Sage"], ["apricot","#C0731F","Apricot"], ["lavender","#7563A6","Lavender"], ["ocean","#38626F","Ocean"], ["rosewood","#9C4353","Rosewood"] ];
var BRIGHT_PRESETS = [ ["Dim",80], ["Soft",90], ["Comfort",100], ["Bright",112] ];
function switchHTML(on, fn){ return '<button class="switch'+(on?' on':'')+'" role="switch" aria-checked="'+on+'" onclick="'+fn+'"></button>'; }
function renderSettings(){
  var st = S.settings;
  var h = pageHead("Settings", "One colour theme across the whole planner, light that suits your eyes, and modes for hard days.");
  h += '<div class="grid c2"><div class="grid" style="gap:16px;align-content:start">'
    + '<div class="card"><h3><i data-lucide="palette"></i>Colour theme</h3><p class="cardsub">One theme, everywhere — hubs, charts, buttons and highlights all follow it.</p><div class="swatches">'
    + THEMES.map(function(t){ return '<button class="swatch'+(st.theme===t[0]?' on':'')+'" onclick="setSetting(\'theme\',\''+t[0]+'\')"><span class="dot" style="background:'+t[1]+'"></span><span class="nm">'+t[2]+'</span></button>'; }).join("")
    + '</div>'
    + '<div class="setrow"><div class="grow"><div class="t">Appearance</div><div class="d">Light, dark — or follow your device. Dark here is a deep warm brown, never black.</div></div>'
    + '<div class="seg"><button class="'+(st.mode==='light'?'on':'')+'" onclick="setSetting(\'mode\',\'light\')">Light</button><button class="'+(st.mode==='dark'?'on':'')+'" onclick="setSetting(\'mode\',\'dark\')">Dark</button><button class="'+(st.mode==='system'?'on':'')+'" onclick="setSetting(\'mode\',\'system\')">Device</button></div></div>'
    + '</div>'
    + '<div class="card"><h3><i data-lucide="sun-medium"></i>Screen brightness</h3><p class="cardsub">Softens or lifts the whole planner — separate from your device brightness.</p>'
    + '<div class="timermodes" style="justify-content:flex-start;margin-bottom:14px">'
    + BRIGHT_PRESETS.map(function(p){ return '<button class="btn '+(st.brightness===p[1]?'':'ghost')+' small" onclick="setSetting(\'brightness\','+p[1]+')">'+p[0]+'</button>'; }).join("")
    + '</div>'
    + '<div style="display:flex;align-items:center;gap:12px"><input type="range" min="70" max="120" step="1" value="'+st.brightness+'" oninput="setSetting(\'brightness\',Number(this.value))" aria-label="Brightness"><strong>'+st.brightness+'%</strong></div></div>'
    + '<div class="card"><h3><i data-lucide="accessibility"></i>Reading comfort</h3>'
    + '<div class="setrow"><div class="grow"><div class="t">Text size</div><div class="d">Applies everywhere, straight away.</div></div>'
    + '<div class="seg"><button class="'+(st.textSize==='small'?'on':'')+'" onclick="setSetting(\'textSize\',\'small\')">Small</button><button class="'+(st.textSize==='medium'?'on':'')+'" onclick="setSetting(\'textSize\',\'medium\')">Medium</button><button class="'+(st.textSize==='large'?'on':'')+'" onclick="setSetting(\'textSize\',\'large\')">Large</button></div></div>'
    + '<div class="setrow"><div class="grow"><div class="t">Easy-read font</div><div class="d">Atkinson Hyperlegible — letterforms designed to be told apart at a glance.</div></div>'
    + switchHTML(st.easyRead, "setSetting('easyRead',"+(!st.easyRead)+")") + '</div>'
    + '<div class="setrow"><div class="grow"><div class="t">Your name</div><div class="d">Used in the Home greeting.</div></div>'
    + '<input type="text" value="'+esc(st.name)+'" maxlength="24" style="width:130px;background:var(--bg);border:1px solid var(--line2);border-radius:10px;padding:8px 10px" onchange="setSetting(\'name\',this.value.trim()||\'Friend\')"></div>'
    + '</div>'
    + '</div><div class="grid" style="gap:16px;align-content:start">'
    + '<div class="card"><h3><i data-lucide="heart-pulse"></i>Gentle modes</h3><p class="cardsub">For the days when the full planner is too much planner.</p>'
    + '<div class="setrow"><div class="grow"><div class="t">Foggy-day mode</div><div class="d">Home shrinks to mood, Top Three and Brain Dump. Everything else waits quietly in its hub.</div></div>'
    + switchHTML(st.foggy, "setSetting('foggy',"+(!st.foggy)+")") + '</div>'
    + '<div class="setrow"><div class="grow"><div class="t">Calm mode</div><div class="d">No animations, no movement. The page holds still.</div></div>'
    + switchHTML(st.calm, "setSetting('calm',"+(!st.calm)+")") + '</div>'
    + '<div class="setrow"><div class="grow"><div class="t">Low-battery mode</div><div class="d">Strips shadows and motion to sip power on a dying battery.</div></div>'
    + switchHTML(st.lowBattery, "setSetting('lowBattery',"+(!st.lowBattery)+")") + '</div>'
    + '</div>'
    + '<div class="card"><h3><i data-lucide="database"></i>Your data</h3><p class="cardsub">Saved in this browser, on this device only — nothing is sent anywhere. Back it up before switching browsers or clearing site data.</p>'
    + '<div style="display:flex;gap:8px;flex-wrap:wrap">'
    + '<button class="btn ghost" onclick="exportData()"><i data-lucide="download"></i>Export backup</button>'
    + '<label class="btn ghost" style="cursor:pointer"><i data-lucide="upload"></i>Import backup<input type="file" accept="application/json" style="display:none" onchange="importData(this)"></label></div>'
    + '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">'
    + (S.sample ? '<button class="btn ghost" onclick="clearSample()">Clear sample data</button>' : '<button class="btn ghost" onclick="loadSample()">Load sample data</button>')
    + '<button class="btn danger" onclick="wipeData()"><i data-lucide="trash-2"></i>Erase everything</button></div>'
    + '</div>'
    + '</div></div>';
  $("#view-settings").innerHTML = h;
}
function exportData(){
  var blob = new Blob([JSON.stringify(S, null, 2)], { type:"application/json" });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "calm-life-planner-backup.json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);
  toast("Backup downloaded");
}
function importData(input){
  var file = input.files && input.files[0]; if(!file) return;
  var reader = new FileReader();
  reader.onload = function(){
    try{
      var data = JSON.parse(reader.result);
      if(!data || !data.settings) throw new Error("bad");
      S = data; save(); applySettings(); render(); toast("Backup imported");
    }catch(e){ toast("That file does not look like a Calm Life Planner backup"); }
  };
  reader.readAsText(file);
}
function wipeData(){
  var keep = S.settings; S = blankState(); S.settings = keep; S.sample = false; save(); render();
  toast("Everything erased — a clean planner");
}

/* ================= Render root ================= */
function render(){
  renderSample();
  renderHome(); renderPlan(); renderMoney(); renderGoals(); renderLearn();
  renderExplore(); renderPeople(); renderCareer(); renderHousehold(); renderMind(); renderWellness(); renderSettings();
  var hubsSlot = $("#sideHubs");
  var alerts = medAlerts().length;
  hubsSlot.innerHTML = HUBS.map(function(hb){
    return '<button class="navitem" data-nav="'+hb.id+'"><i data-lucide="'+hb.icon+'"></i>'+hb.name
      + (hb.id === "wellness" && alerts ? '<span class="badge">'+alerts+'</span>' : '') + '</button>';
  }).join("");
  $$("#sideHubs [data-nav]").forEach(function(b){
    b.addEventListener("click", function(){ go(b.getAttribute("data-nav")); });
    b.classList.toggle("active", b.getAttribute("data-nav") === ui.view);
  });
  $$(".sidebar > [data-nav], .bottomnav [data-nav]").forEach(function(b){
    b.classList.toggle("active", b.getAttribute("data-nav") === ui.view);
  });
  icons();
}
function init(){
  $("#brandDate").textContent = new Date().toLocaleDateString(undefined, { weekday:"long", month:"long", day:"numeric" });
  applySettings();
  render();
  go("home");
  if(window.matchMedia){
    window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function(){ applySettings(); });
  }
}
init();

function toggleSound(kind){
  if(ui.soundOn === kind){ stopSound(); ui.soundOn = null; render(); return; }
  stopSound();
  var ctx = ensureAudio(); if(!ctx){ toast("Audio is not available in this browser"); return; }
  ui.soundOn = kind;
  if(kind === "bells"){
    var strike = function(){
      if(!AC) return;
      var o = AC.createOscillator(), g = AC.createGain();
      o.type = "sine"; o.frequency.value = [523.25, 659.25, 783.99][Math.floor(Math.random()*3)];
      g.gain.setValueAtTime(0.0001, AC.currentTime);
      g.gain.exponentialRampToValueAtTime(0.14, AC.currentTime + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + 2.6);
      o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime + 2.7);
    };
    strike(); bellInt = setInterval(strike, 4200);
  } else {
    var len = 2 * ctx.sampleRate, buf = ctx.createBuffer(1, len, ctx.sampleRate), data = buf.getChannelData(0), last = 0;
    for(var i=0;i<len;i++){
      var white = Math.random()*2-1;
      if(kind === "rain"){ data[i] = white * 0.32; }
      else { last = (last + 0.02*white)/1.02; data[i] = last * 3.2; }
    }
    var src = ctx.createBufferSource(); src.buffer = buf; src.loop = true;
    var filt = ctx.createBiquadFilter(); filt.type = "lowpass"; filt.frequency.value = kind === "rain" ? 1400 : 420;
    var g = ctx.createGain(); g.gain.value = kind === "rain" ? 0.16 : 0.5;
    src.connect(filt); filt.connect(g); g.connect(ctx.destination); src.start();
    soundNodes = { src: src, gain: g };
  }
  render();
}
